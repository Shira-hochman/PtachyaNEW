<div class="management-container">
    <p-toolbar styleClass="custom-toolbar">
        <div class="p-toolbar-group-start">
            <div class="header-titles">
                <h1 class="main-title"> ניהול רשימת גנים</h1>
                <nav class="breadcrumb-simple">מערכת פתחיה > ניהול > גנים</nav>
            </div>
        </div>
        <div class="p-toolbar-group-end">
            <button pButton pRipple label="הוספת גן חדש" icon="pi pi-plus-circle"
                class="p-button-primary p-button-sm action-btn-main" [routerLink]="['/admin/kindergartens/add']">
            </button>
        </div>
    </p-toolbar>

    <div class="content-card">
        <div *ngIf="isLoading" class="loading-overlay">
            <p-progressSpinner strokeWidth="4"></p-progressSpinner>
            <p>טוען נתונים מהשרת...</p>
        </div>

        <div *ngIf="errorMessage" class="error-banner">
            <i class="pi pi-exclamation-triangle"></i> {{ errorMessage }}
        </div>

        <p-table [value]="kindergartens || []" 
                 [rows]="10" 
                 [paginator]="true"
                 styleClass="p-datatable-sm p-datatable-gridlines custom-table"
                 *ngIf="!isLoading && kindergartens">
            
            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="kindergartenId" style="width: 80px">ID <p-sortIcon field="kindergartenId"></p-sortIcon></th>
                    <th pSortableColumn="code">קוד גן <p-sortIcon field="code"></p-sortIcon></th>
                    <th pSortableColumn="name">שם הגן <p-sortIcon field="name"></p-sortIcon></th>
                    <th>כתובת</th>
                    <th class="text-center" style="width: 150px">פעולות</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-kg>
                <tr class="table-row">
                    <td><span class="id-badge">{{ kg.kindergartenId }}</span></td>
                    <td><span class="code-tag">{{ kg.code }}</span></td>
                    <td class="text-bold">{{ kg.name }}</td>
                    <td class="text-secondary">{{ kg.address }}</td>
                    <td class="text-center">
                        <div class="action-buttons">
                            <button pButton icon="pi pi-pencil" 
                                    class="p-button-rounded p-button-text p-button-info"
                                    [routerLink]="['/admin/kindergartens/edit', kg.kindergartenId]"
                                    pTooltip="עריכה">
                            </button>
                            <button pButton icon="pi pi-trash" 
                                    class="p-button-rounded p-button-text p-button-danger"
                                    (click)="deleteKindergarten(kg.kindergartenId)"
                                    pTooltip="מחיקה">
                            </button>
                        </div>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="5" class="empty-msg">לא נמצאו גנים במערכת.</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
