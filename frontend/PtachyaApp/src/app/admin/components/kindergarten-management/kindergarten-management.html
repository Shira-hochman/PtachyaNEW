<div class="management-wrapper">
    <div class="header-section">
        <h1> 🏘️ ניהול פרטי גנים</h1>
        <p class="subtitle">צפייה, חיפוש, סינון ועדכון פרטי הגנים במערכת.</p>
    </div>

    <div class="controls-bar">
        <button class="action-button primary-add-btn" [routerLink]="['/admin/kindergartens/add']">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            הוסף גן חדש
        </button>
    </div>

    <div *ngIf="isLoading" class="status-message loading">טוען נתונים...</div>
    <div *ngIf="errorMessage" class="status-message error">{{ errorMessage }}</div>

    <div *ngIf="kindergartens && kindergartens.length > 0 && !isLoading" class="table-card">
        <h2>רשימת גנים ({{ kindergartens.length }} סה"כ)</h2>
        <div class="table-scroll">
            
            <table> 
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>קוד גן</th>
                        <th>שם הגן</th> 
                        <th>כתובת</th>
                        <th>פעולות</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let kg of kindergartens">
                        <td>{{ kg.kindergartenId }}</td>
                        <td>{{ kg.code }}</td> 
                        <td>{{ kg.name }}</td>
                        <td>{{ kg.address }}</td>
                        
                        <td class="actions-cell">
                            <button class="action-btn edit-btn" [routerLink]="['/admin/kindergartens/edit', kg.kindergartenId]">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                עריכה
                            </button>
                            
                            <button class="action-btn delete-btn" (click)="deleteKindergarten(kg.kindergartenId)">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                מחיקה
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div *ngIf="kindergartens && kindergartens.length === 0 && !isLoading && !errorMessage" class="status-message info">
        לא נמצאו גנים במערכת.
    </div>

</div>
