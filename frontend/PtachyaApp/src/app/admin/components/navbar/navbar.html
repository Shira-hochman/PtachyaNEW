<header class="modern-navbar">
    <div class="nav-container">
        
        <div class="nav-brand">
            <div class="logo-wrapper">
                <img src="https://upload.wikimedia.org/wikipedia/he/4/4b/%D7%A4%D7%AA%D7%97%D7%99%D7%94.png" 
                     alt="Petachya Logo" 
                     class="main-logo">
            </div>
            <div class="brand-divider"></div>
            <span class="app-name">מערכת ניהול <span class="highlight">פתחיה</span></span>
        </div>

        <div class="nav-actions">
            <div class="user-profile-info">
                <div class="text-info">
                    <span class="user-role">מנהל מחובר</span>
                    <span class="user-name">{{ managerName }}</span>
                </div>
                <p-avatar [label]="userInitial" 
                          styleClass="custom-avatar" 
                          shape="circle" 
                          size="large">
                </p-avatar>
            </div>

            <button pButton 
                    pRipple 
                    icon="pi pi-sign-out" 
                    label="יציאה" 
                    class="p-button-rounded p-button-danger p-button-text logout-modern-btn"
                    (click)="logout()"
                    pTooltip="התנתקות מהמערכת"
                    tooltipPosition="bottom">
            </button>
        </div>
    </div>
</header>
