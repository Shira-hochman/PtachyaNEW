<div class="login-page" dir="rtl">
  
    <div class="login-card">
      
      <!-- כותרת ולוגו -->
      <div class="card-header">
        <div class="logo-container">
          <img src="https://upload.wikimedia.org/wikipedia/he/4/4b/%D7%A4%D7%AA%D7%97%D7%99%D7%94.png" alt="לוגו פתחיה" class="logo">
        </div>
        <h2>כניסה למערכת ניהול</h2>
        <p class="subtitle">אנא הזינו פרטי מנהל לכניסה</p>
      </div>
  
      <!-- טופס -->
      <div class="card-body">
        
        <!-- שדה שם משתמש -->
        <div class="form-group">
          <label for="username">שם משתמש</label>
          <div class="input-wrapper">
            <input
              id="username"
              type="text"
              [(ngModel)]="username"
              placeholder="הקלד שם משתמש"
              (keyup.enter)="login()"
              [class.input-error]="message && !username && !isLoading"
            />
            <span class="icon">👤</span>
          </div>
        </div>
  
        <!-- שדה סיסמה -->
        <div class="form-group">
          <label for="password">סיסמה</label>
          <div class="input-wrapper">
            <input
              id="password"
              type="password"
              [(ngModel)]="password"
              placeholder="הקלד סיסמה"
              (keyup.enter)="login()"
              [class.input-error]="message && !password && !isLoading"
            />
            <span class="icon">🔒</span>
          </div>
        </div>
  
        <!-- כפתור התחברות -->
        <button (click)="login()" [disabled]="isLoading" class="btn-login">
          <span *ngIf="!isLoading">כניסה למערכת</span>
          <span *ngIf="isLoading" class="loader"></span>
        </button>
  
        <!-- הודעות -->
        <div class="message-container" *ngIf="message">
          <p [ngClass]="{'success-msg': message.includes('מוצלחת') || message.includes('מעביר'), 'error-msg': !message.includes('מוצלחת') && !message.includes('מעביר') && !message.includes('מתחבר')}">
            {{ message }}
          </p>
        </div>
  
      </div>
      
      <div class="card-footer">
        <p>© מערכת ניהול - עמותת פתחיה</p>
      </div>
  
    </div>
  </div>
