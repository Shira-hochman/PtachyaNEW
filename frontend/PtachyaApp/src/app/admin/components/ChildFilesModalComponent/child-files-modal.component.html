<div class="modal-backdrop" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <div class="header-info">
        <i class="pi pi-folder-open header-icon"></i>
        <h3>ניהול טפסים: {{ childName }}</h3>
      </div>
      <button pButton icon="pi pi-times" 
              class="p-button-rounded p-button-text p-button-secondary close-btn" 
              (click)="closeModal()">
      </button>
    </div>

    <div class="modal-body">
      <div *ngIf="isLoading" class="loading-container">
        <p-progressSpinner strokeWidth="4"></p-progressSpinner>
        <p>טוען נתונים...</p>
      </div>

      <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="w-full mb-3"></p-message>
      <p-message *ngIf="!isLoading && !errorMessage && files.length === 0" 
                 severity="info" 
                 text="לא נמצאו טפסים לילד זה." 
                 styleClass="w-full">
      </p-message>

      <div class="table-responsive-wrapper" *ngIf="files.length > 0 && !isLoading">
        <table class="files-table">
          <thead>
            <tr>
              <th>שם המסמך</th>
              <th>תאריך העלאה</th>
              <th class="text-center">פעולה</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let file of files">
              <td>
                <div class="file-cell">
                  <i class="pi pi-file-pdf file-icon-styled"></i>
                  <span class="file-name-text">{{ file.fileName || 'מסמך ללא שם' }}</span>
                </div>
              </td>
              <td class="date-cell">{{ file.uploadDate | date:'dd/MM/yyyy' }}</td>
              <td class="text-center">
                <button class="download-btn" (click)="downloadFile(file.downloadUrl)" [disabled]="!file.fileName">
                  <i class="pi pi-download"></i>
                  <span class="btn-text">הורדה</span>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
