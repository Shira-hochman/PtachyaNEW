<div class="login-page" dir="rtl">
  
  <div class="login-card">
    
    <!-- כותרת ולוגו -->
    <div class="card-header">
      <div class="logo-container">
        <!-- ניתן להחליף את ה-src ללוגו המקומי שלך -->
        <img src="https://upload.wikimedia.org/wikipedia/he/4/4b/%D7%A4%D7%AA%D7%97%D7%99%D7%94.png" alt="לוגו פתחיה" class="logo">
      </div>
      <h2>כניסה לאזור הילד/הורה</h2>
      <p class="subtitle">אנא הזינו את פרטי הילד/ה לכניסה למערכת</p>
    </div>

    <!-- טופס -->
    <div class="card-body">
      
      <!-- שדה תעודת זהות -->
      <div class="form-group">
        <label for="childId">תעודת זהות</label>
        <div class="input-wrapper">
          <input
            id="childId"
            type="text"
            [(ngModel)]="childId"
            placeholder="הקלד ת.ז. (9 ספרות)"
            maxlength="9"
            [class.input-error]="message && !childId && message !== 'בודק נתונים...'"
          />
          <span class="icon">🆔</span>
        </div>
      </div>

      <!-- שדה תאריך לידה -->
      <div class="form-group">
        <label for="birthDate">תאריך לידה</label>
        <div class="input-wrapper">
          <input
            id="birthDate"
            type="date"
            [(ngModel)]="birthDate"
            [class.input-error]="message && !birthDate && message !== 'בודק נתונים...'"
          />
        </div>
      </div>

      <!-- כפתור התחברות -->
      <button (click)="login()" [disabled]="isLoading" class="btn-login">
        <span *ngIf="!isLoading">התחברות</span>
        <span *ngIf="isLoading" class="loader"></span> <!-- ספינר CSS -->
      </button>

      <!-- הודעות -->
      <div class="message-container" *ngIf="message">
        <p [ngClass]="{'success-msg': message.includes('מוצלחת'), 'error-msg': !message.includes('מוצלחת') && !message.includes('בודק')}">
          {{ message }}
        </p>
      </div>

    </div>
    
    <div class="card-footer">
      <p>© כל הזכויות שמורות לעמותת פתחיה</p>
    </div>

  </div>
</div>
