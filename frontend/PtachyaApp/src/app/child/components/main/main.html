<div class="main-wrapper" dir="rtl">
  
  <!-- כותרת עליונה עם לוגו ופרטים -->
  <header class="top-header">
    <div class="header-content">
      <div class="logo-area">
        <img src="https://upload.wikimedia.org/wikipedia/he/4/4b/%D7%A4%D7%AA%D7%97%D7%99%D7%94.png" alt="לוגו פתחיה" class="logo">
      </div>
      <div class="user-info">
        <span class="greeting">שלום, {{ userName }}</span>
        <span class="date">{{ currentDate }}</span>
      </div>
      <button class="logout-btn" (click)="logout()" title="התנתק">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </button>
    </div>
  </header>

  <!-- תוכן מרכזי -->
  <main class="dashboard-content">
    
    <div class="welcome-banner">
      <h1>אזור אישי</h1>
      <p>ברוכים הבאים למערכת הרישום והמידע של פתחיה. בחרו בפעולה הרצויה:</p>
    </div>

    <div class="cards-grid">
      
      <!-- כרטיס 1: הצהרת בריאות -->
      <div class="action-card" (click)="onButton1Click()">
        <div class="card-icon health-icon">
          <!-- אייקון לב -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </div>
        <div class="card-text">
          <h3>הצהרת בריאות</h3>
          <p>מילוי הצהרת בריאות יומית לילד/ה</p>
        </div>
        <div class="card-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </div>
      </div>

      <!-- כרטיס 2: טופס תשלום -->
      <div class="action-card" (click)="onButton2Click()">
        <div class="card-icon payment-icon">
          <!-- אייקון אשראי/טופס -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
            <line x1="1" y1="10" x2="23" y2="10"></line>
          </svg>
        </div>
        <div class="card-text">
          <h3>תשלום ותקנון</h3>
          <p>הסדרת תשלומים וצפייה בתקנון הרישום</p>
        </div>
        <div class="card-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </div>
      </div>

    </div>
  </main>

  <footer class="main-footer">
    <p>© כל הזכויות שמורות לעמותת פתחיה</p>
  </footer>
</div>
